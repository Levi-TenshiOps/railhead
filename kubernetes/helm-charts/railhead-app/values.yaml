api:
  image:
    repository: 993268717190.dkr.ecr.us-east-1.amazonaws.com/railhead-api
    tag: "ab88f85"
  replicaCount: 2
  service:
    port: 80
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

worker:
  image:
    repository: 993268717190.dkr.ecr.us-east-1.amazonaws.com/railhead-worker
    tag: "b2e37c9"
  replicaCount: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

postgresql:
  auth:
    username: railhead
    database: railhead
    # Points at a Terraform-managed secret (terraform/modules/argocd) rather
    # than letting this chart auto-generate its own password. ArgoCD
    # re-renders this chart from scratch on every sync with no Helm release
    # history to preserve a chart-generated password via `lookup` -- an
    # in-chart-generated password can silently change underneath an
    # already-initialized Postgres pod. This secret's value is written once
    # by Terraform and never changes across ArgoCD syncs.
    existingSecret: railhead-postgresql-auth
  primary:
    persistence:
      storageClass: gp3
      size: 2Gi

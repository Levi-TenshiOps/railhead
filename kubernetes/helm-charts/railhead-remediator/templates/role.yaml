apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: railhead-remediator
  namespace: {{ .Values.namespace }}
rules:
  # `patch` is how a pod actually gets quarantined (the `app` label change).
  # `delete` exists ONLY for the TTL sweep of already-quarantined pods --
  # never used as a remediation action against a healthy, in-service pod.
  # `list` is needed for the TTL sweep to find quarantined pods by label;
  # `get` is needed to re-read a named pod's current labels before acting.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get"]
